name: Build MINICRAFT SURVIVAL IPA (chua ky)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show project structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== game ==="
          ls -la game

      - name: Install npm dependencies
        run: npm install

      - name: Install Capacitor CLI & iOS platform
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          npx cap add ios || echo "iOS platform already exists"
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios/App
          pod install --repo-update

      - name: Build iOS app (unsigned)
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package into IPA (unsigned)
        run: |
          cd ios/App
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy file .app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MINICRAFT-SURVIVAL.ipa Payload
          ls -la MINICRAFT-SURVIVAL.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINICRAFT-SURVIVAL-ipa
          path: ios/App/MINICRAFT-SURVIVAL.ipa
          if-no-files-found: error
          retention-days: 7
